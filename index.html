<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="card">
      <div class="search">
        <input type="text" placeholder="Enter City Name" spellcheck="false" />
        <button><img src="./Images/icons8-search-50.png" /></button>
      </div>
      <div class="weather">
        <img
          src="./Images/icons8-rain-cloud-48.png"
          alt=""
          class="weather-icon"
        />
        <h1 class="temp">22°C</h1>
        <h2 class="City">Timergara</h2>
        <div class="details">
          <div class="colm">
            <img src="./Images/icons8-humidity-50.png" />
            <div>
              <p class="humidity">50%</p>
              <p>humidity</p>
            </div>
          </div>
          <div class="colm">
            <img src="./Images/icons8-wind-50.png" />
            <div>
              <p class="wind">15 Km/h</p>
              <p>Wind Speed</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const url = "https://google.com";
      fetch(url)
      .then((Response)=> {
        console.log(Response);
      })
      .catch((err)=> {
        console.log(err);
      })
    </script>
  </body>
</html>
